add_newline = false
command_timeout = 20000 # Timeout in milliseconds

format = """
[](fg:#fab387)\
[](bg:#fab387 fg:#313244)\
[](fg:#fab387 bg:#313244)\
$directory\
"""

right_format = """
[](fg:#21222E)\
$git_branch\
$git_status\
$git_state\
$python\
$cmd_duration\
$status\
[](fg:#21222E)\
"""


[directory]
style = "fg:#C0C9F6 bg:#313244"
format = "[ $path ]($style)[ ](fg:#313244)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"~/Dev/Python" = "Python"
"~/Documents" = "󰈙 Documents"
"~/Downloads" = " Downloads"
"~/Music" = " Music"
"~/Pictures" = " Pictures"
"~/Dev" = " Dev"
"~" = " ~"

[character]
success_symbol = '[✔](fg:#313244 bg:#21222E)'
error_symbol = '[x](fg:bold red bg:#21222E)'
# format = ""

[status]
success_symbol = '[✔](fg:#757AA1 bg:#21222E)'
symbol = '[✘](fg:#FF7580 bg:#21222E)'
map_symbol = false
disabled = false
style = "bg:#21222E"
format = '[$symbol]($style)'


[python]
python_binary = 'python3'
style = "fg:#FEC776 bg:#21222E"
symbol = ""
format = '[ ${symbol}${pyenv_prefix}(${version})  ]($style)'
detect_extensions = []
detect_files = []
detect_folders = []

[git_branch]
symbol = ""
format = '[ $symbol $branch ](fg:#C3E88E bg:#21222E)'

[git_status]
format = '[($all_status$ahead_behind)](bg:#21222E fg:#E8FFC6)'
conflicted = "⚔️  "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
style = "bold yellow"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bg:#21222E fg:#E8FFC6"

[time]
disabled = false
time_format = "%R"                         # Hour:Minute Format
style = "bg:#21222E"
format = '[ $time](fg:#a0a9cb bg:#21222E)'

[cmd_duration]
min_time = 5                                     # 2 seconds = 2000
format = '[ $duration ](fg:#a0a9cb bg:#21222E)'
show_milliseconds = false
